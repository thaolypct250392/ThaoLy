<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Báo cáo học sinh</title>
<script src="./vendor/room-qr.js?v=2"></script>
<script src="./license.js?v=30.5.homework-scan.9"></script>
<style>
:root{color-scheme:light;font:16px/1.5 system-ui,sans-serif;color:#192b45;background:#eef4ff}
body{max-width:1040px;margin:auto;padding:clamp(14px,4vw,40px)}
header{padding:clamp(20px,5vw,38px);color:white;background:linear-gradient(115deg,#263280,#6444aa);border-radius:20px}
h1,h2{margin:0 0 8px}
header a{color:#fff}
nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button,select{font:inherit;border:1px solid #b3bfea;border-radius:8px;padding:8px 12px}
button{cursor:pointer;background:#e8edff;color:#283478;font-weight:650}
section,article,details{background:#fff;border:1px solid #dae3fa;border-radius:16px;padding:clamp(12px,3vw,22px);margin-block:16px}
#homework{border-top:5px solid #7754cc}
#live{border-top:5px solid #cb7726}
a{color:#3645aa}
.report-scroll{overflow:auto;margin-top:12px}
table{width:100%;border-collapse:collapse}
td,th{padding:9px;text-align:left;border-bottom:1px solid #e4eafd}
th{background:#e7ebff;color:#333b80}
tbody tr:nth-child(even){background:#f5f8ff}
.done{color:#146346;font-weight:700}
.pending{color:#875118;font-weight:700}
.report-filters:not([hidden]){display:flex;gap:12px;flex-wrap:wrap}
.report-filters label{display:grid;gap:6px;min-width:0;font-weight:650}
.report-filters select{width:100%;max-width:min(75vw,100%);background:#f7f8ff}
</style>
<header>
  <h1>Báo cáo học sinh</h1>
  <nav><a href="./game.html">Về trò chơi</a><button id="login-history">Đăng nhập Google / Tải lại</button></nav>
</header>
<main>
  <section id="homework">
    <h2>Báo cáo bài tập về nhà</h2>
    <p id="homework-status" role="status">Đang tải báo cáo…</p>
    <div class="report-filters" id="homework-filters" hidden>
      <label>Chọn bài tập<select id="homework-select"></select></label>
    </div>
    <div id="homework-results"></div>
  </section>
  <details id="live"><summary>Phòng trực tiếp</summary><p id="status" role="status"></p><div id="rooms"></div></details>
</main>
<script type="module" src="./history.mjs?v=30.5.homework-replay.10"></script>
</html>
