<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị Gmail giáo viên</title><script src="./license.js?v=30.5.race"></script><style>body{background:#09122b;color:white;font:17px system-ui;padding:24px;max-width:1050px;margin:auto}button,input{font:inherit;padding:12px;border-radius:9px;margin:5px;max-width:90%}table{width:100%;text-align:left;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #345;overflow-wrap:anywhere}a{color:#8fd7ff}#status{min-height:28px}input{width:280px}</style></head><body><h1>Quản trị quyền giáo viên</h1><p>Chủ sở hữu: <span id="owner-email"></span></p><p id="google-identity">Chưa đăng nhập</p><button id="login">Đăng nhập bằng Google</button><button onclick="googleTeacherSignOut()">Đăng xuất</button><main id="console" hidden><p>Mỗi giáo viên có kho đề, phòng chơi và kết quả riêng theo UID.</p><label>Gmail giáo viên <input id="email" type="email" placeholder="giaovien@gmail.com"></label><label>Tên giáo viên <input id="label" placeholder="Tên hiển thị"></label><button id="grant">Cấp quyền</button><table><thead><tr><th>Giáo viên</th><th>Gmail</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="rows"></tbody></table></main><p id="status" role="status"></p><a href="./game.html">Về trò chơi</a><script>
const el=id=>document.getElementById(id);
connectionReady.then(m=>m.getConnection()).then(c=>{el('owner-email').textContent=c.ownerEmail||'Chưa cấu hình';}).catch(()=>{});
async function adminApi(action,body={}){return sparkApi(action,body);}
async function load(){const {teachers}=await adminApi('admin-list');el('console').hidden=false;el('rows').replaceChildren();for(const t of teachers){const tr=document.createElement('tr');for(const text of [t.label,t.email,t.enabled?'Đang được cấp quyền':'Đã khóa']){const td=document.createElement('td');td.textContent=text;tr.append(td);}const td=document.createElement('td'),b=document.createElement('button');b.textContent=t.enabled?'Khóa':'Mở khóa';b.onclick=()=>run(async()=>{await adminApi('admin-lock',{email:t.email,locked:t.enabled});await load();});td.append(b);tr.append(td);el('rows').append(tr);}}
async function run(fn){try{await fn();el('status').textContent='Đã cập nhật.';}catch(e){el('status').textContent=e.message;}}
el('login').onclick=()=>run(async()=>{if(await googleTeacherSignIn())await load();});
el('grant').onclick=()=>run(async()=>{await adminApi('admin-grant',{email:el('email').value,label:el('label').value});await load();});
firebaseReady.then(()=>run(load)).catch(e=>{el('status').textContent='Không tải được đăng nhập Google: '+e.message;});
</script></body></html>
